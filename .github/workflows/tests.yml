name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Um PostgreSQL temporário só pros testes (some quando o job termina)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: english_ze
          POSTGRES_PASSWORD: english_ze
          POSTGRES_DB: english_ze_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U english_ze"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://english_ze:english_ze@localhost:5432/english_ze_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      # Os testes usam uma chave falsa (tests/conftest.py): nunca chamam a API de verdade.
      - name: Rodar testes
        run: pytest -q

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Checar tipos
        run: npm run typecheck

      - name: Rodar testes
        run: npm test

      - name: Gerar o app
        run: npm run build
