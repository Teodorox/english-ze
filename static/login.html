<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>English Ze · Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&family=Space+Grotesk:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <main class="login-wrap">
    <div class="login-brand">
      <h1>English <span>Ze</span></h1>
      <span class="live-pill"><span class="dot"></span>LIVE</span>
    </div>
    <form id="login-form" class="card form">
      <span class="tag">pull up, bro</span>
      <label>Senha
        <input type="password" name="password" required autofocus autocomplete="current-password">
      </label>
      <button type="submit" class="primary">Entrar</button>
      <p id="login-status" class="muted" role="alert"></p>
    </form>
  </main>

  <script>
    const form = document.getElementById("login-form");
    const status = document.getElementById("login-status");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const button = form.querySelector("button");
      button.disabled = true;
      status.textContent = "";
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: form.password.value }),
        });
        if (res.ok) {
          location.href = "/";
          return;
        }
        const data = await res.json().catch(() => ({}));
        status.textContent = `⚠️ ${data.detail || "Não deu pra entrar."}`;
        form.password.select();
      } catch {
        status.textContent = "⚠️ Sem conexão com o servidor.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
